<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="boxBody" x1="20" y1="40" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DD3FC" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="boxLid" x1="20" y1="20" x2="180" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#BAE6FD" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="28" y="62" width="144" height="112" rx="18" fill="url(#boxBody)" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3"/>
  <rect x="24" y="34" width="152" height="42" rx="14" fill="url(#boxLid)" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="3"/>
  <rect x="94" y="34" width="12" height="140" rx="6" fill="#FFFFFF" fill-opacity="0.35"/>
  <circle cx="100" cy="118" r="28" fill="#FFFFFF" fill-opacity="0.22" filter="url(#glow)"/>
  <text x="100" y="130" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#FFFFFF">?</text>
</svg>
